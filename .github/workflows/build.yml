name: Build APK with Docker (joaoventura)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build APK with Buildozer Docker image
        run: |
          docker run --rm -v ${{ github.workspace }}:/app \
            joaoventura/buildozer \
            /bin/bash -c "cd /app && buildozer android debug"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loginapp-debug.apk
          path: bin/*.apk
