name: Build APK Express

on:
  workflow_dispatch:  # Permite ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip openjdk-17-jdk cython3 zlib1g-dev
          pip install --user buildozer==1.5.0 cython==0.29.33 kivy==2.3.0

      - name: Fast Android Setup
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          echo "y" | buildozer android debug 2>&1 | grep "Accept licenses" || true
          buildozer android clean

      - name: Turbo Build
        run: |
          export PATH=$HOME/.local/bin:$PATH
          buildozer -v android debug deploy 2>&1 | tee build.log
          grep "Package built:" build.log || (echo "Build failed!" && exit 1)

      - name: Get APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: bin/*.apk
          if-no-files-found: error
