name: Build APK Definitivo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar dependencias esenciales
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-pip \
            openjdk-17-jdk \
            cython3 \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            git \
            unzip \
            wget

      - name: Configurar Python
        run: |
          python -m pip install --upgrade pip wheel
          pip install --user buildozer==1.5.0 cython==0.29.33

      - name: Preparar entorno Android (Solución AIDL + Permisos)
        run: |
          # Configuración robusta de directorios
          sudo mkdir -p /home/runner/.android
          sudo chown -R runner:runner /home/runner/.android
          touch /home/runner/.android/repositories.cfg
          chmod 644 /home/runner/.android/repositories.cfg

          # Instalación manual del Android SDK
          mkdir -p $HOME/.buildozer/android/platform/android-sdk
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline-tools.zip
          unzip /tmp/cmdline-tools.zip -d $HOME/.buildozer/android/platform/android-sdk/
          mv $HOME/.buildozer/android/platform/android-sdk/cmdline-tools $HOME/.buildozer/android/platform/android-sdk/cmdline-tools

          # Instalar componentes críticos
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/bin/sdkmanager \
            --sdk_root=$HOME/.buildozer/android/platform/android-sdk \
            "build-tools;34.0.0" \
            "platform-tools" \
            "platforms;android-33" \
            "aidl"

          # Aceptar licencias automáticamente
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/bin/sdkmanager --licenses

      - name: Compilación con reintento automático
        run: |
          export PATH=$HOME/.local/bin:$PATH
          buildozer -v android clean
          buildozer -v android debug || (sleep 30 && buildozer -v android debug)

      - name: Verificar APK generado
        run: |
          ls -lh bin/
          if [ ! -f bin/*.apk ]; then
            echo "::error::No se encontró el archivo APK generado"
            exit 1
          fi

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 3
