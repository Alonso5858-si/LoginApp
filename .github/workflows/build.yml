name: Build APK URGENTE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependencias CRÍTICAS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-pip \
            openjdk-17-jdk \
            cython3 \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            git \
            unzip \
            wget

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --user buildozer==1.5.0 cython==0.29.33 kivy==2.3.0

      - name: PREPARACIÓN ANDROID (Solución Definitiva)
        run: |
          mkdir -p "${HOME}/.android" || true
          touch "${HOME}/.android/repositories.cfg" || true
          mkdir -p "${HOME}/.buildozer/android/platform/android-sdk/cmdline-tools" || true

          echo "🔽 Descargando commandlinetools..."
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/tools.zip || \
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/tools.zip

          unzip -q /tmp/tools.zip -d /tmp/
          mv /tmp/cmdline-tools "${HOME}/.buildozer/android/platform/android-sdk/cmdline-tools/latest"

          echo "🛠 Instalando componentes Android..."
          for i in {1..3}; do
            "${HOME}/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
              --sdk_root="${HOME}/.buildozer/android/platform/android-sdk" \
              "build-tools;34.0.0" \
              "platform-tools" \
              "platforms;android-33" && break || sleep 10
          done

          echo "📝 Aceptando licencias..."
          yes | "${HOME}/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: CONSTRUIR APK (sin limpiar si no existe)
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"

          # Solo limpia si ya existe python-for-android
          [ -d ".buildozer/android/platform/python-for-android" ] && buildozer android clean || echo "🟡 Nada que limpiar"

          # Intento principal + 2 reintentos
          for i in {1..3}; do
            echo "INTENTO $i/3"
            buildozer -v android debug && break || sleep 30
          done

      - name: OBTENER APK
        uses: actions/upload-artifact@v4
        with:
          name: TU_APK_LISTO
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7

