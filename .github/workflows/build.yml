name: Build APK Urgente

on:
  push:
    branches: [main]
  workflow_dispatch:  # Permite ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar dependencias básicas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-pip \
            openjdk-17-jdk \
            cython3 \
            zlib1g-dev \
            git \
            unzip

      - name: Instalar Buildozer y dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install --user buildozer==1.5.0 cython==0.29.33 kivy==2.3.0

      - name: Configurar Android SDK (Solución AIDL)
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Descarga e instalación directa de commandlinetools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $HOME/.buildozer/android/platform/
          mv $HOME/.buildozer/android/platform/cmdline-tools $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
          
          # Instalar componentes esenciales
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/bin/sdkmanager \
            --sdk_root=$HOME/.buildozer/android/platform/android-sdk \
            "build-tools;34.0.0" \
            "platform-tools" \
            "platforms;android-33" \
            "aidl"

          # Aceptar licencias automáticamente
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/bin/sdkmanager --licenses

      - name: Compilación rápida
        run: |
          export PATH=$HOME/.local/bin:$PATH
          buildozer -v android clean
          buildozer -v android debug || (sleep 30 && buildozer -v android debug)

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 1
